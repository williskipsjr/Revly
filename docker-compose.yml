name: rev-recovery

# Phase 0 skeleton: all services boot and health-check against empty Postgres/Redis.
# Prometheus + Grafana are intentionally deferred to Phase 10 (kept minimal by design).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-revrec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revrec_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-revrecovery}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied in alphabetical order, but ONLY on a fresh (empty) data volume.
      # After changing these, recreate the volume: `docker compose down -v && docker compose up`.
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./migrations/002_phase2_kill_switch.sql:/docker-entrypoint-initdb.d/002_phase2_kill_switch.sql:ro
      - ./migrations/003_phase5_policy.sql:/docker-entrypoint-initdb.d/003_phase5_policy.sql:ro
      - ./migrations/004_phase6_execution.sql:/docker-entrypoint-initdb.d/004_phase6_execution.sql:ro
      # Seed runs last (init scripts apply in alphabetical order), after every migration.
      - ./scripts/seed_dev.sql:/docker-entrypoint-initdb.d/005_seed_dev.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-revrec} -d ${POSTGRES_DB:-revrecovery}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  decision-engine:
    build: ./decision-engine
    environment:
      DECISION_ENGINE_PORT: "8080"
      SERVICE_VERSION: "0.1.0"
      DATABASE_URL: ${DATABASE_URL:-postgres://revrec:revrec_dev_pw@postgres:5432/revrecovery?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DIAGNOSIS_SERVICE_URL: ${DIAGNOSIS_SERVICE_URL:-http://diagnosis-service:8000}
      # Phase 4: per-call LLM-diagnosis timeout (ms). On timeout (or any failure) the engine uses
      # the deterministic rule table, so a slow/absent gateway never wedges ingestion.
      DIAGNOSIS_TIMEOUT_MS: ${DIAGNOSIS_TIMEOUT_MS:-6000}
      # Empty = webhook signature verification disabled (dev only; logged at startup).
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      # Phase 3: the trained P(success) logistic-regression artifact, mounted read-only below.
      # If absent/unreadable the engine falls back to the Phase-2 heuristic (logged at startup).
      SUCCESS_MODEL_PATH: ${SUCCESS_MODEL_PATH:-/etc/decision-engine/success_model.json}
      # Phase 6: background reconciliation sweep interval (ms); 0/unset disables the loop.
      RECONCILE_INTERVAL_MS: ${RECONCILE_INTERVAL_MS:-30000}
      # Phase 6: Razorpay sandbox credentials. Unset → deterministic mock executor (no money moves).
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_BASE_URL: ${RAZORPAY_BASE_URL:-https://api.razorpay.com}
      # Phase 7: public/admin API keys. Unset → auth disabled (dev only; logged at startup).
      API_KEY: ${API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - ./ml/artifacts/success_model.json:/etc/decision-engine/success_model.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  diagnosis-service:
    build: ./diagnosis-service
    environment:
      DIAGNOSIS_SERVICE_PORT: "8000"
      # Phase 4: AgentRouter (Anthropic-compatible) inference gateway. Bearer auth via
      # ANTHROPIC_AUTH_TOKEN (ANTHROPIC_API_KEY accepted as an alias). Both empty = the diagnose
      # endpoint 503s and the Go engine uses the deterministic rule-based fallback.
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://agentrouter.org}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 12

  dashboard:
    build: ./dashboard
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      - decision-engine
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12

  # Phase 10: minimal engineering telemetry (intentionally secondary to the Next.js product
  # dashboard). Prometheus scrapes the decision-engine /metrics endpoint; Grafana renders one
  # basic dashboard. Both are optional to the demo and can be omitted with a compose profile.
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - decision-engine

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  grafana-data:
