# Prometheus scrape config (Phase 10). Minimal by design — one job scraping the decision
# engine's /metrics endpoint. Grafana reads from this Prometheus instance.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: decision-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["decision-engine:8080"]
